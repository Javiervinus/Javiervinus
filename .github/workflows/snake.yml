name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Javiervinus
          outputs: |
            dist/github-snake.svg?color_snake=#c9d1d9&color_dots=#161b22,#30363d,#484f58,#6e7681,#8b949e
            dist/github-snake-light.svg?color_snake=#24292f&color_dots=#ebedf0,#d0d7de,#afb8c1,#8c959f,#6e7781

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
